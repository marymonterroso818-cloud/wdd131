<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Tables</title>
  <meta name="description" content="HTML table practice for WDD 131">
  <meta name="author" content="Mary Monterroso">
  <link rel="stylesheet" href="styles/html-tables.css">
</head>
<body>
  <table>
    <caption>Table 1: Account Feature Comparison</caption>
    <thead>
      <tr>
        <th>Account Features</th>
        <th>Basic</th>
        <th>Premium</th>
        <th>Deluxe</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Online Banking</th>
        <td>✔️</td>
        <td>✔️</td>
        <td>✔️</td>
      </tr>
      <tr>
        <th scope="row">Mobile App Access</th>
        <td>❌</td>
        <td>✔️</td>
        <td>✔️</td>
      </tr>
      <tr>
        <th scope="row">Priority Support</th>
        <td>❌</td>
        <td>❌</td>
        <td>✔️</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
